<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="720" rx="28" fill="#f8fafc"/>
  <text x="900" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="url(#titleGrad)">Indoor Scene Change Detection — System Pipeline</text>
  <text x="900" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748b">YOLO11s object detection + alignment + pixel evidence + rule-based Add / Delete / Move reasoning</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="300" height="145" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <rect x="470" y="145" width="300" height="145" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="870" y="145" width="300" height="145" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1270" y="145" width="350" height="145" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>
  </g>

  <circle cx="105" cy="168" r="22" fill="#dbeafe"/><text x="105" y="175" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1d4ed8">1</text>
  <text x="220" y="205" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Reference + Query</text>
  <text x="220" y="235" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Paired indoor scene images</text>
  <text x="220" y="260" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">before / after a scene change</text>

  <circle cx="505" cy="168" r="22" fill="#ede9fe"/><text x="505" y="175" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#6d28d9">2</text>
  <text x="620" y="205" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">CLAHE Preprocessing</text>
  <text x="620" y="235" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">LAB lightness-channel enhancement</text>
  <text x="620" y="260" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">colour preserved</text>

  <circle cx="905" cy="168" r="22" fill="#fef3c7"/><text x="905" y="175" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#b45309">3</text>
  <text x="1020" y="205" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">YOLO11s Detection</text>
  <text x="1020" y="235" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">class · bbox · confidence</text>
  <text x="1020" y="260" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">strong + weak evidence boxes</text>

  <circle cx="1305" cy="168" r="22" fill="#ccfbf1"/><text x="1305" y="175" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f766e">4</text>
  <text x="1445" y="205" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Camera Alignment</text>
  <text x="1445" y="235" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">ORB feature matching + ratio test</text>
  <text x="1445" y="260" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">RANSAC homography: reference → query</text>

  <line x1="370" y1="218" x2="450" y2="218" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="770" y1="218" x2="850" y2="218" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1170" y1="218" x2="1250" y2="218" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- curved transition -->
  <path d="M1445 290 C1445 340 1100 335 1100 385" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g filter="url(#shadow)">
    <rect x="1060" y="405" width="330" height="160" rx="18" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
    <rect x="660" y="405" width="320" height="160" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>
    <rect x="270" y="405" width="310" height="160" rx="18" fill="#ffffff" stroke="#ec4899" stroke-width="3"/>
    <rect x="70" y="605" width="1550" height="78" rx="18" fill="#0f172a"/>
  </g>

  <circle cx="1095" cy="430" r="22" fill="#fee2e2"/><text x="1095" y="437" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#b91c1c">5</text>
  <text x="1225" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Pixel + Appearance Evidence</text>
  <text x="1225" y="495" text-anchor="middle" font-family="Arial" font-size="15.5" fill="#475569">SSIM + CIELAB chroma + robust z-score</text>
  <text x="1225" y="521" text-anchor="middle" font-family="Arial" font-size="15.5" fill="#475569">HSV histogram similarity per object</text>
  <text x="1225" y="547" text-anchor="middle" font-family="Arial" font-size="15.5" fill="#475569">changed-pixel fraction inside boxes</text>

  <circle cx="695" cy="430" r="22" fill="#e0e7ff"/><text x="695" y="437" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#4338ca">6</text>
  <text x="820" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Object Matching</text>
  <text x="820" y="495" text-anchor="middle" font-family="Arial" font-size="15.5" fill="#475569">per-class Hungarian assignment</text>
  <text x="820" y="521" text-anchor="middle" font-family="Arial" font-size="15.5" fill="#475569">distance + IoU + appearance cost</text>
  <text x="820" y="547" text-anchor="middle" font-family="Arial" font-size="15.5" fill="#475569">matched / leftover object candidates</text>

  <circle cx="305" cy="430" r="22" fill="#fce7f3"/><text x="305" y="437" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#be185d">7</text>
  <text x="425" y="462" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Rule-Based Reasoning</text>
  <text x="425" y="495" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Move thresholds · ghost check</text>
  <text x="425" y="521" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">cross-class suppression · recovery</text>
  <text x="425" y="547" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">low-confidence fallback · probability</text>

  <line x1="1060" y1="485" x2="1000" y2="485" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="660" y1="485" x2="600" y2="485" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M425 565 C425 590 425 592 425 602" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="235" y="640" font-family="Arial" font-size="22" font-weight="700" fill="#ffffff">8  Final Decision</text>
  <text x="480" y="640" font-family="Arial" font-size="18" fill="#cbd5e1">Events ≥ 60% probability →</text>
  <rect x="720" y="620" width="190" height="43" rx="12" fill="#16a34a"/><text x="815" y="648" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#ffffff">ADD</text>
  <rect x="930" y="620" width="190" height="43" rx="12" fill="#dc2626"/><text x="1025" y="648" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#ffffff">DELETE</text>
  <rect x="1140" y="620" width="190" height="43" rx="12" fill="#ea580c"/><text x="1235" y="648" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#ffffff">MOVE</text>
  <text x="1415" y="640" font-family="Arial" font-size="16" fill="#cbd5e1">object + probability</text>
</svg>
